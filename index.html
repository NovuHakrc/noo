<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Vault - The Secret of Clark</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: #050505;
            color: white;
            font-family: Arial, sans-serif;
            min-height: 100vh;
        }

        /* VAULT */

        .vault {
            position: fixed;
            top: 25px;
            left: 0;
            width: 100%;
            text-align: center;
            font-size: 13px;
            letter-spacing: 7px;
            color: #777;
            z-index: 10;
        }

        /* PASSWORD SCREEN */

        #loginScreen {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-box {
            width: 90%;
            max-width: 350px;
            text-align: center;
        }

        h1 {
            font-size: 22px;
            font-weight: 400;
            letter-spacing: 3px;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #666;
            font-size: 12px;
            margin-bottom: 25px;
        }

        input {
            width: 100%;
            padding: 13px;
            background: transparent;
            border: 1px solid #333;
            border-radius: 6px;
            color: white;
            text-align: center;
            outline: none;
        }

        input:focus {
            border-color: #777;
        }

        #enterButton {
            width: 100%;
            padding: 13px;
            margin-top: 10px;
            border: none;
            border-radius: 6px;
            background: white;
            color: black;
            cursor: pointer;
        }

        #enterButton:hover {
            background: #ccc;
        }

        #error {
            display: none;
            margin-top: 10px;
            color: #777;
            font-size: 12px;
        }

        /* MUSIC BUTTON */

        #musicButton {
            position: fixed;
            bottom: 20px;
            left: 20px;
            z-index: 100;

            width: auto;
            padding: 9px 15px;

            background: #111;
            color: #aaa;

            border: 1px solid #333;
            border-radius: 20px;

            font-size: 12px;
            cursor: pointer;
        }

        #musicButton:hover {
            background: #1b1b1b;
            color: white;
        }

        /* SECRET SCREEN */

        #secretScreen {
            display: none;

            min-height: 100vh;
            padding: 90px 20px 30px;

            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        .secret-title {
            font-size: clamp(25px, 5vw, 50px);
            letter-spacing: 4px;
            margin-bottom: 25px;
            text-align: center;
        }

        .video {
            width: 90%;
            max-width: 850px;
            aspect-ratio: 16 / 9;
        }

        .video iframe {
            width: 100%;
            height: 100%;
            border: none;
            border-radius: 8px;
        }

        .access {
            color: #555;
            font-size: 11px;
            letter-spacing: 3px;
            margin-top: 15px;
        }
    </style>
</head>

<body>

    <!-- VAULT -->

    <div class="vault">
        VAULT
    </div>


    <!-- PASSWORD -->

    <div id="loginScreen">

        <div class="login-box">

            <h1>THE SECRET OF CLARK</h1>

            <div class="subtitle">
                ENTER PASSWORD
            </div>

            <input
                type="password"
                id="password"
                placeholder="Password"
                autocomplete="off"
            >

            <button id="enterButton" onclick="unlockVault()">
                ENTER
            </button>

            <div id="error">
                Incorrect password
            </div>

        </div>

    </div>


    <!-- MUSIC -->

    <audio id="bgMusic" loop preload="auto">
        <source
            src="Panaginip - nicole (Official Music Video).mp3"
            type="audio/mpeg"
        >
    </audio>


    <button id="musicButton" onclick="toggleMusic()">
        🔇 Music
    </button>


    <!-- SECRET VIDEO -->

    <div id="secretScreen">

        <div class="secret-title">
            THE SECRET OF CLARK
        </div>

        <div class="video">

            <iframe
                src="https://streamable.com/e/ewf0kj"
                allowfullscreen>
            </iframe>

        </div>

        <div class="access">
            ACCESS GRANTED
        </div>

    </div>


    <script>

        /* =========================
           PASSWORD
        ========================= */

        const correctPassword = "clarkpogi123";

        function unlockVault() {

            const password =
                document.getElementById("password").value;

            const error =
                document.getElementById("error");

            if (password === correctPassword) {

                document.getElementById("loginScreen").style.display = "none";

                document.getElementById("secretScreen").style.display = "flex";

                error.style.display = "none";

            } else {

                error.style.display = "block";

                document.getElementById("password").value = "";
            }
        }


        /* ENTER KEY */

        document.getElementById("password")
            .addEventListener("keydown", function(event) {

                if (event.key === "Enter") {
                    unlockVault();
                }

            });


        /* =========================
           MUSIC
           ========================= */

        const music =
            document.getElementById("bgMusic");

        const musicButton =
            document.getElementById("musicButton");


        /*
           Try to autoplay.

           Browsers may block audible
           autoplay until the user interacts.
        */

        music.volume = 0.5;

        music.play().then(() => {

            musicButton.textContent = "🔊 Music";

        }).catch(() => {

            musicButton.textContent = "▶ Play Music";

        });


        /* MUTE / PLAY */

        function toggleMusic() {

            if (music.paused) {

                music.play();

                musicButton.textContent = "🔊 Music";

            } else {

                music.pause();

                musicButton.textContent = "▶ Play Music";

            }

        }

    </script>

</body>
</html>
